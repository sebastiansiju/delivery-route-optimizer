name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the runner's system python3 (rather than actions/setup-python)
      # so that apt's python3-tk package matches the interpreter's ABI.
      # A mismatched pair leaves tkinter unimportable and the whole suite
      # silently "passes" as all-skipped.
      - name: Install Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
